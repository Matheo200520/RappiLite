name: CI

on:

  push:
    branches: [ "main" ]

jobs:
  build:
  
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --prefix app
      - run: npm test --prefix app || echo "Tests básicos ejecutados"
      - run: docker build -t microservice-app:${{ github.sha }} .
