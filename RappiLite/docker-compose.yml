services:
  # Instancia pública (única) accesible desde localhost
  app-public:
    build: .
    ports:
      - "3000:3000"
    expose:
      - "3000"

  # Instancias internas (para escalado horizontal)
  app:
    build: .
    expose:
      - "3000"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app
      - app-public

  grafana:
    image: grafana/grafana-oss
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
